name: Docker Test Build
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Get current date
        id: meta
        run: echo "date_label=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "package_version=$(jq -r .version frontend/package.json)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Multi-Platform Production Images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/toomas633/homepage:dev
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.date_label }}
            org.opencontainers.image.version=${{ steps.pkg.outputs.package_version }}
          cache-from: type=registry,ref=ghcr.io/toomas633/homepage:buildcache
          cache-to: type=registry,ref=ghcr.io/toomas633/homepage:buildcache,mode=max

      - name: Run SonarQube Analysis (AMD64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sonar-scan
          push: false
          secrets: |
            sonar_token=${{ secrets.SONAR_TOKEN }}
          build-args: |
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}
            GITHUB_BASE_REF=${{ github.event.pull_request.base.ref }}
            GITHUB_HEAD_REF=${{ github.event.pull_request.head.ref }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/toomas633/homepage:buildcache
