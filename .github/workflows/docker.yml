name: Docker image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to run the workflow on'
        required: true
        type: choice
        options:
          - main
          - develop
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_label: ${{ steps.meta.outputs.date_label }}
      package_version: ${{ steps.pkg.outputs.package_version }}
    steps:
      - name: Get current date
        id: meta
        run: echo "date_label=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "package_version=$(jq -r .version frontend/package.json)" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Multi-Platform Production Images
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production-stage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/toomas633/homepage:latest
            ghcr.io/toomas633/homepage:${{ needs.prepare.outputs.package_version }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.date_label }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.package_version }}
          cache-from: |
            type=registry,ref=ghcr.io/toomas633/homepage:buildcache
            type=registry,ref=ghcr.io/toomas633/homepage:latest
          cache-to: type=registry,ref=ghcr.io/toomas633/homepage:buildcache,mode=max

  sonar:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Run SonarQube Analysis
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-sonarscan
          target: sonar-scan
          push: false
          secrets: |
            sonar_token=${{ secrets.SONAR_TOKEN }}
          build-args: |
            GITHUB_REF_NAME=${{ github.ref_name }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/toomas633/homepage:buildcache
            type=registry,ref=ghcr.io/toomas633/homepage:latest
